[package]
name = "xcomm-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Benchmark harness comparing xcomm with minicom, picocom and tio"
publish = false

[dependencies]
libc = "0.2.186"
rustix = { version = "1.1.6", features = ["termios", "pty", "fs", "event", "system"] }
serde_json = "1.0.154"

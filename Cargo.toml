[workspace]
members = [".", "bench"]

[package]
name = "xcomm"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Fast serial terminal with an agent control interface and a herdr plugin"
repository = "https://github.com/cantona/xcomm"
keywords = ["serial", "terminal", "minicom", "uart", "tty"]
categories = ["command-line-utilities", "hardware-support"]
readme = "README.md"
# Only what builds and tests the crate: the README's pictures, CI and the
# tools that make the pictures stay in the repository. The tests read
# build.sh, install.sh and plugin-action.sh.
include = [
    "/src/",
    "/tests/",
    "/examples/",
    "/skills/",
    "/scripts/build.sh",
    "/scripts/install.sh",
    "/scripts/plugin-action.sh",
    "/herdr-plugin.toml",
    "/xcomm.1",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/Cargo.lock",
]

[dependencies]
lexopt = "0.3.2"
memchr = "2.8.3"
libc = "0.2.186"
rustix = { version = "1.1.6", features = ["termios", "pipe", "fs", "process", "event", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }

[features]
# Unicode-aware \w, \d, \s and (?i) for `ctl wait/run --unicode`. Off by
# default: the tables are relocated at load, in every xcomm process.
unicode = ["regex/unicode-perl", "regex/unicode-case"]

[dev-dependencies]
# Reads herdr-plugin.toml in tests only: the binary does not link it.
toml = "1.1.4"
rustix = { version = "1.1.6", features = ["termios", "pipe", "pty", "fs", "event"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
